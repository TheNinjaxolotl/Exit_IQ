<title>ExitIQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 480px), tab bar fixed at the bottom, sheets slide up over it. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EEF0F3; --line:#E4E6EB; --line-2:#D5D9E1;
  --fg:#0E1116; --fg-2:#5B6170; --fg-3:#4A505C;
  --accent:#2747E0; --accent-press:#1A35B8; --accent-tint:#E8ECFD; --accent-on-tint:#1A35B8; --on-accent:#FFFFFF;
  --warn:#EA580C; --warn-tint:#FFEDD5; --warn-soft:#FFF7ED; --warn-on:#9A3412; --warn-line:#F3C9A5;
  --ok-tint:#DCFCE7; --ok-on:#166534;
  --ink:#0E1116; --ink-fg:#FFFFFF; --ink-2:#B4BAC6; --ink-line:#2E3440; --ink-dot:#FB923C; --ink-chip:#2E3440;
  --strong-bg:#0E1116; --strong-fg:#FFFFFF;
  --overlay:rgba(14,17,22,.45);
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r-card:20px; --r-tile:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D11; --surface:#151820; --surface-2:#1D212B; --line:#262B36; --line-2:#343A47;
  --fg:#F2F4F8; --fg-2:#A3AAB8; --fg-3:#B4BAC6;
  --accent:#7C93FF; --accent-press:#9AABFF; --accent-tint:#1E2650; --accent-on-tint:#C3CCFF; --on-accent:#0B0D11;
  --warn:#FB923C; --warn-tint:#3A2212; --warn-soft:#2A1A0F; --warn-on:#FDBA74; --warn-line:#5C3417;
  --ok-tint:#12301E; --ok-on:#86EFAC;
  --ink:#1D212B; --ink-fg:#F2F4F8; --ink-2:#A3AAB8; --ink-line:#343A47; --ink-dot:#FB923C; --ink-chip:#2B303C;
  --strong-bg:#F2F4F8; --strong-fg:#0B0D11;
  --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D11; --surface:#151820; --surface-2:#1D212B; --line:#262B36; --line-2:#343A47;
  --fg:#F2F4F8; --fg-2:#A3AAB8; --fg-3:#B4BAC6;
  --accent:#7C93FF; --accent-press:#9AABFF; --accent-tint:#1E2650; --accent-on-tint:#C3CCFF; --on-accent:#0B0D11;
  --warn:#FB923C; --warn-tint:#3A2212; --warn-soft:#2A1A0F; --warn-on:#FDBA74; --warn-line:#5C3417;
  --ok-tint:#12301E; --ok-on:#86EFAC;
  --ink:#1D212B; --ink-fg:#F2F4F8; --ink-2:#A3AAB8; --ink-line:#343A47; --ink-dot:#FB923C; --ink-chip:#2B303C;
  --strong-bg:#F2F4F8; --strong-fg:#0B0D11;
  --overlay:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.screen{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
.screen.no-tabs{padding-bottom:40px}
.screen.has-bar{padding-bottom:130px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:13px;color:var(--fg-2);font-weight:500}
.h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.top .h1{font-size:22px}
.h2{font-size:17px;font-weight:600}
.actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);position:relative;padding:0}
.icon-btn.plain{border:0;background:transparent}
.icon-btn .badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cancel-btn{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-weight:600;font-size:13px;color:var(--fg)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--strong-bg);color:var(--strong-fg);border:0;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
svg{flex-shrink:0}

/* atoms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg-3);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;background:var(--surface-2);color:var(--fg-3);white-space:nowrap}
.chip.blue{background:var(--accent-tint);color:var(--accent-on-tint)}
.chip.warn{background:var(--warn-tint);color:var(--warn-on)}
.chip.ok{background:var(--ok-tint);color:var(--ok-on)}
.prem{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-on-tint);background:var(--accent-tint);padding:3px 6px;border-radius:5px}
.tile{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;color:var(--fg)}
.tile.lg{width:60px;height:60px;border-radius:16px;font-size:24px}
.tile.warn{background:var(--warn-tint);color:var(--warn-on)}
.muted{color:var(--fg-2)}
.small{font-size:13px}
.xs{font-size:12px}
.row-flex{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;color:var(--fg)}
.btn.strong{background:var(--strong-bg);color:var(--strong-fg);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.accent:active{background:var(--accent-press)}
.btn.warn{background:var(--warn);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn.sm{height:44px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link-btn{background:transparent;border:0;color:var(--accent);font-weight:600;font-size:14px;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.list{overflow:hidden}
.list>*+*{border-top:1px solid var(--surface-2)}
.sec-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.sec-title.warn{color:var(--warn-on)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input{height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font-size:15px;width:100%;min-width:0}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.err{color:var(--warn-on);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--strong-bg);color:var(--strong-fg);border-color:transparent}
.demo-note{font-size:12px;color:var(--fg-2);display:flex;gap:6px;align-items:flex-start}

/* subscription rows with swipe-to-cancel */
.srow{position:relative;overflow:hidden}
.srow .under{position:absolute;inset:0 0 0 auto;width:96px;background:var(--warn);color:#fff;border:0;font-weight:700;font-size:14px}
.srow .over{position:relative;background:var(--surface);display:flex;gap:12px;align-items:center;padding:12px 14px 12px 16px;transition:transform .18s ease;touch-action:pan-y}
.srow.open .over{transform:translateX(-96px)}
.srow .main{display:flex;gap:12px;align-items:center;flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;min-height:44px;color:var(--fg)}
.srow .amt{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.srow .xbtn{width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--warn-on);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--fg-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* hero */
.hero{background:var(--ink);color:var(--ink-fg);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:14px}
:is(.hero,.band) .lbl{font-size:13px;color:var(--ink-2);font-weight:500}
:is(.hero,.band) .big{font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tl{position:relative;height:60px}
.tl .rail{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--ink-line);border-radius:2px}
.tl .dot{position:absolute;top:14px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink-fg);border:3px solid var(--ink)}
.tl .dot.trial{background:var(--ink-dot);width:16px;height:16px;margin-left:-8px;top:13px}
.tl .tick{position:absolute;left:0;top:15px;width:2px;height:12px;background:var(--ink-2);border-radius:1px}
.tl .cap{position:absolute;top:40px;font-size:11px;color:var(--ink-2)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* urgent */
.urgent{border-color:var(--warn-line)}
.deadline{background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--warn-on);font-size:13px;font-weight:500}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding-top:8px;padding-bottom:10px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;min-height:48px;border:0;background:none;color:var(--fg-2);font-size:11px;font-weight:500}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* sticky action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

/* sheets */
.ov{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-10px;background:var(--bg);padding-top:6px;padding-bottom:6px;z-index:2}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* exit path */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li label{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.steps input{position:absolute;opacity:0;width:1px;height:1px}
.steps .num{width:26px;height:26px;border-radius:50%;background:var(--strong-bg);color:var(--strong-fg);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.steps input:checked+.num{background:var(--ok-on);color:var(--surface)}
.steps input:focus-visible+.num{outline:2px solid var(--accent);outline-offset:2px}
.steps input:checked~.txt{color:var(--fg-2);text-decoration:line-through}
.steps .txt{padding-top:3px;font-size:14px}
.urlbox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 10px 8px 12px}
.urlbox code{font-family:var(--mono);font-size:12px;flex:1;min-width:0;overflow-wrap:anywhere}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--fg-3)}
.note strong{color:var(--fg)}
.note.warn{background:var(--warn-soft);color:var(--warn-on)}
.note.warn strong{color:var(--warn-on)}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 32px;gap:24px}
.ob .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:260px}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:4px;border-radius:2px;background:var(--line-2)}
.dots i.on{background:var(--fg)}
.ob h1{font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.ob p{font-size:16px;color:var(--fg-2);max-width:38ch}

/* calendar */
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{font-size:11px;font-weight:600;color:var(--fg-2);text-align:center;padding-bottom:4px}
.day{height:48px;border-radius:12px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;padding:0;color:var(--fg)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.day.sel{background:var(--strong-bg);color:var(--strong-fg)}
.day.has{font-weight:600}
.day i{width:6px;height:6px;border-radius:50%}
.day i.r{background:var(--accent)}
.day.sel i.r{background:var(--strong-fg)}
.day i.c{border:1.5px solid var(--warn)}
.day.blank{visibility:hidden}

/* chat */
.bubble{max-width:86%;font-size:14px;padding:11px 14px;border-radius:18px;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-radius:18px 18px 4px 18px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px}
.composer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:19;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.composer form{max-width:448px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:4px 4px 4px 14px}
.composer input{flex:1;border:0;outline:none;background:transparent;min-height:44px;min-width:0;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rcard{display:flex;flex-direction:column;gap:10px;padding:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--strong-bg);color:var(--strong-fg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check.off svg{visibility:hidden}
.pick{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;background:transparent;border:0;text-align:left;min-height:60px;color:var(--fg)}
.pick[disabled]{opacity:.55}
.opt{display:flex;gap:14px;align-items:center;padding:16px;text-decoration:none;color:var(--fg);width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.opt.best{border:2px solid var(--accent);padding:15px}
.opt .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prog{height:6px;background:var(--ink-line);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:6px;background:var(--ink-dot);border-radius:3px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.setrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;padding:0 16px;background:none;border:0;text-align:left;color:var(--fg);font-size:15px;text-decoration:none}
.setrow .v{color:var(--fg-2);font-size:13px;display:flex;align-items:center;gap:6px}
.bank{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;min-height:56px;color:var(--fg)}
.stat{display:flex;flex-direction:column;gap:4px;padding:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
@media (min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg)}}

/* brand + onboarding (single deliberate dark look) */
:root{--display:'Funnel Display','Geist',ui-sans-serif,system-ui,sans-serif;
  --ob-bg:#0A0E18; --ob-fg:#F4F6FB; --ob-2:#A3ACBF; --ob-line:#1C2436; --ob-line-2:#2C3650; --ob-card:#121827;
  --ob-blue:#6683FF; --ob-orange:#FB923C; --ob-green:#4ADE80;
  --t0b:#E6F4EA;--t0f:#166534; --t1b:#E8ECFD;--t1f:#1A35B8; --t2b:#F1E9FE;--t2f:#6B21A8; --t3b:#FDE8EC;--t3f:#9F1239;
  --t4b:#E0F2F1;--t4f:#115E59; --t5b:#FEF3C7;--t5f:#854D0E; --t6b:#EEF0F3;--t6f:#0E1116; --t7b:#FFEDD5;--t7f:#9A3412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t0b:#12301E;--t0f:#86EFAC;--t1b:#1E2650;--t1f:#C3CCFF;--t2b:#2A1D45;--t2f:#D8B4FE;--t3b:#3B1622;--t3f:#FDA4AF;--t4b:#0F2E2C;--t4f:#5EEAD4;--t5b:#3A2C0C;--t5f:#FCD34D;--t6b:#1D212B;--t6f:#F2F4F8;--t7b:#3A2212;--t7f:#FDBA74}}

/* ---------- money math ---------- */
const monthly=s=>s.cycle==='yearly'?Math.round(s.price/12):s.cycle==='weekly'?Math.round(s.price*52/12):s.price;
function occurrences(s,from,to){
  const out=[]; if(s.status==='cancelled'||s.status==='watching') return out;
  let d=parse(s.status==='trial'?s.trialEnd:s.nextRenewal); let first=true; let guard=0;
  while(d<=to&&guard++<60){ if(d>=from) out.push({date:new Date(d),sub:s,cond:s.status==='trial',first:first&&s.status==='trial'});
    d=s.cycle==='yearly'?addMonths(d,12):s.cycle==='weekly'?addDays(d,7):addMonths(d,1); first=false;}
  return out;
}
function upcoming(n){const f=today(),t=addDays(f,n);return S.subs.flatMap(s=>occurrences(s,f,t)).sort((a,b)=>a.date-b.date)}
function cancelBy(s){const d=parse(s.status==='trial'?s.trialEnd:s.nextRenewal);return addDays(d,-1)}
function priceUp(s){const c=s.charges||[];if(c.length<2)return 0;const a=c[c.length-1].a,b=c[c.length-2].a;return a>b?a-b:0}
function remindFor(s){return s.remind||S.settings.remind}

/* ---------- notifications ---------- */
function computeNotes(){
  const t=today(); const out=[];
  S.subs.forEach(s=>{ if(s.status==='cancelled'||s.status==='watching')return;
    const ev=parse(s.status==='trial'?s.trialEnd:s.nextRenewal); const left=daysBetween(t,ev); if(left<0)return;
    const hit=remindFor(s).filter(d=>d>=left).sort((a,b)=>a-b)[0]; if(hit===undefined)return;
    const id=s.id+'@'+iso(ev)+'#'+hit; if(S.dismissed.includes(id))return;
    const what=s.status==='trial'?'trial ends':'renews';
    out.push({id,sub:s,title:s.name+' '+what+(left===0?' today':left===1?' tomorrow':' in '+left+' days'),body:(s.status==='trial'?'Then ':'')+money(s.price)+(s.cycle==='yearly'?'/yr':'/mo')+'. Cancel by '+fmtD(cancelBy(s))+', 11:59 PM.',urgent:left<=3});
  });
  S.proofs.forEach(p=>{if(p.status==='charged'){const id='charged-'+p.id; if(!S.dismissed.includes(id)) out.push({id,proof:p,title:p.name+' charged after cancelling',body:'Your proof is ready. Create a dispute packet for your bank.',urgent:true})}});
  return out;
}

/* ---------- Exit difficulty (transparent score) ---------- */
function pathData(s,bill){
  const e=exitFor(s.slug,s.name);
  if(bill==='apple'||bill==='google') return {n:5,method:'In app',login:true,mins:1,fee:null,unknown:false};
  if(bill==='carrier'||bill==='bundle') return {n:4,method:'Online',login:true,mins:4,fee:null,unknown:!e.web};
  if(e.web) return {n:e.web.steps.length,method:e.web.method,login:e.web.login,mins:e.web.mins,fee:e.web.fee||null,unknown:false};
  const c=(S.aiPaths||{})[s.slug||slugify(s.name)];
  return {n:c?c.steps.length:4,method:c?c.method:'Online',login:true,mins:c?c.mins:3,fee:null,unknown:true};
}
function difficulty(s,bill){
  const d=pathData(s,bill||s.billing||'website'); let sc=1; const f=[];
  if(d.n>=6){sc+=2;f.push([d.n+' steps','+2'])} else if(d.n>=4){sc+=1;f.push([d.n+' steps','+1'])} else f.push([d.n+' steps','+0']);
  if(d.method==='Phone'){sc+=4;f.push(['Phone call required','+4'])} else if(d.method==='Email'||d.method==='Chat'){sc+=2;f.push([d.method+' required','+2'])} else f.push(['Cancel '+d.method.toLowerCase(),'+0']);
  if(d.login){sc+=1;f.push(['Login required','+1'])}
  if(d.fee){sc+=2;f.push(['Fee or notice period','+2'])}
  if(d.mins>=4){sc+=1;f.push(['About '+d.mins+' minutes','+1'])}
  if(d.unknown){sc+=2;f.push(['Steps not verified','+2'])}
  sc=Math.max(1,Math.min(10,sc));
  return {score:sc,label:sc<=3?'Easy exit':sc<=6?'Medium exit':'Hard exit',cls:sc<=3?'ok':sc<=6?'blue':'warn',factors:f};
}
function diffBlock(s,bill){

  if(ai&&useGemini()&&!(S.aiPaths||{})[key]) h+='<button class="btn block sm" data-a="aiDraft" data-n="'+esc(e.name)+'" data-k="'+esc(key)+'">Draft specific steps with AI</button>';
  if(p.fee) h+='<div class="note warn"><strong>Heads up:</strong> '+esc(p.fee)+'</div>';
  if(ev) h+='<div class="note"><strong>Cancelling ends access on '+esc(fmtD(ev))+', not today.</strong> You keep what you paid for until then.</div>';
  if(bill==='website'&&!e.internal&&!e.fictional) h+='<div class="note"><strong>Billed by Apple or Google?</strong> Their store controls it, so cancel there instead. Pick Apple or Google Play above.</div>';
  h+='<div class="between" style="border-top:1px solid var(--surface-2);padding-top:12px;flex-wrap:wrap">'+(ai?'<span class="chip warn">Unverified — AI-drafted</span>':v?'<span class="xs muted">Last verified '+esc(fmtDS(parse(v)))+', '+parse(v).getFullYear()+'</span>':e.fictional?'<span class="xs muted">Fictional demo service</span>':'<span class="chip warn">Unverified</span>')+'<button class="link-btn" data-a="reportOutdated" data-n="'+esc(e.name)+'">Report outdated</button></div>';
  if(!inline&&s.id&&(s.status==='active'||s.status==='trial')) h+='<button class="btn strong block" data-a="iCancelled" data-id="'+s.id+'">I cancelled</button>';
  return h+'</section>';
}

const BANKS=['First Platypus Bank (Sandbox)','Chase','Bank of America','Wells Fargo','Capital One','Navy Federal Credit Union','Truist','PNC Bank','U.S. Bank','American Express'];

const AI_RULES=`You are the ExitIQ assistant. Your job: help the user get what they want for the least money, and never get trapped in a subscription. Answer in 1–3 short sentences, then return structured result cards. Prefer free options first, then free trials, then the cheapest paid option. Always check the user's existing subscriptions first and say if something is already included. Never state streaming availability, prices, or trial lengths as fact unless they come from a tool result; otherwise say they should be checked. Never invent URLs; use only official domains. When suggesting a free trial, always offer to track it so the user gets reminded before it charges. If the user wants to cancel something, open its Exit Path. No legal or financial advice.

IMPORTANT for this version: you have NO live streaming-availability data and no tools. For any movie or show, give the likely ways to watch it (services that commonly carry it, rent/buy, theaters if recent) as options TO CHECK, set kind "stream", and fill "title". Never say a title "is on" a service as fact. Prices: give typical published prices only as "about $X/mo — check current price"; if unsure, use "Check current price". Trial lengths: say "Free trial may be available — check" unless widely known, and set trialDays to your best typical estimate (or null).

Reply with ONLY one JSON object, no other text:
{"reply": string (1-3 short sentences), "cards": [ {"service": string, "plan": string, "price": string, "priceCents": number|null (typical monthly price in cents, null if free/unknown), "trial": string|null (short, e.g. "7-day trial may be available"), "trialDays": number|null, "included": boolean (true only if one of the user's CURRENT subscriptions already covers it), "includedVia": string|null, "kind": "stream"|"app"|"alternative"|"discount", "title": string|null, "rentBuy": string|null, "note": string|null (one short sentence), "domain": string|null (official bare domain like "netflix.com", or null) } ] }
Use 1 to 4 cards. Put free options first.`;

  const t=q.toLowerCase(); const act=activeSubs(); const has=k=>act.some(s=>s.slug===k||s.name.toLowerCase().includes(k));
  const sub=(slug)=>act.find(s=>s.slug===slug);
  if(/watch|movie|film|show|stream|series|odyssey/.test(t)){
    const m=q.match(/watch\s+(?:the movie\s+)?(.+?)[?.!]*$/i); const title=m?m[1].replace(/^the movie /i,'').trim():'that title';
    const cards=[];
    if(has('amazon')||has('prime')) cards.push({service:'Amazon Prime Video',plan:'Your current plan',price:'$0 extra',included:true,includedVia:'Amazon Prime',kind:'stream',title,note:'Check whether it\'s included before paying for anything new.',domain:'primevideo.com'});
    cards.push({service:'Peacock',plan:'Premium',price:'Check current price',trial:'Free trial may be available — check',trialDays:7,priceCents:799,kind:'stream',title,note:/odyssey/i.test(title)?'The Odyssey is a Universal film, and Universal films usually stream on Peacock after theaters.':'Check which service carries it before starting a trial.',domain:'peacocktv.com'});
    cards.push({service:'Rent or buy digitally',plan:'One-time',price:'Check current price',kind:'stream',title,rentBuy:'Apple TV, Prime Video, or Google Play',note:'No subscription to forget about.',domain:null});
    return {reply:'Here\'s the cheapest way to watch '+title+', starting with what you already pay for. Availability changes weekly, so check before you start a trial.',cards};
  }
  if(/photoshop|photo edit|design|canva|adobe|illustrator/.test(t)){
    return {reply:'For photo edits you probably don\'t need the full Adobe suite. Start free, then pay only if you hit a limit.',cards:[
      {service:'Photopea',plan:'Free in your browser',price:'Free',kind:'alternative',note:'Opens PSD files and works a lot like Photoshop.',domain:'photopea.com'},
      {service:'GIMP',plan:'Free, open source',price:'Free',kind:'alternative',note:'Full photo editor that works offline.',domain:'gimp.org'},
      {service:'Canva Free',plan:'Free plan',price:'Free',included:has('canva'),includedVia:has('canva')?'your Canva account':null,kind:'alternative',note:'Templates and quick edits; Pro adds brand kits and premium assets.',domain:'canva.com'},
      {service:'Adobe Photoshop plan',plan:'Photoshop only',price:'Check current price',kind:'discount',note:'Costs less than the full Creative Cloud. Check student pricing too.',domain:'adobe.com'}]};
  }
  if(/music|song|spotify|playlist|ads/.test(t)){
    return {reply:'Free music almost always comes with ads. To skip ads for less, look at student or family plans.',cards:[
      {service:'Spotify Free',plan:'Free with ads',price:'Free',kind:'alternative',included:has('spotify'),includedVia:has('spotify')?'your Spotify account':null,note:'Shuffle play and ads on mobile.',domain:'spotify.com'},
      {service:'Spotify Premium Student',plan:'Student plan',price:'Check current price',kind:'discount',note:'About half the regular price if you\'re a verified student.',domain:'spotify.com'},
      {service:'YouTube Music',plan:'Free with ads',price:'Free',kind:'alternative',included:has('youtube'),includedVia:has('youtube')?'YouTube Premium':null,note:has('youtube')?'Ad-free music is already included in your YouTube Premium.':'Ad-free is included with YouTube Premium.',domain:'youtube.com'}]};
  }
  if(/duolingo|language|spanish|french|learn/.test(t)){
    return {reply:'You can learn a language well for free. Pay only if you want offline lessons or no ads.',cards:[
      {service:'Duolingo',plan:'Free plan',price:'Free',kind:'alternative',note:'The free plan has every lesson, with ads.',domain:'duolingo.com'},
      {service:'Khan Academy',plan:'Free',price:'Free',kind:'alternative',note:'Free courses with no ads, great for grammar and school subjects.',domain:'khanacademy.org'},
      {service:'Your library\'s free apps',plan:'Free with a library card',price:'Free',kind:'alternative',note:'Many libraries offer language apps through Libby or Kanopy.',domain:'libbyapp.com'}]};
  }
  if(/monthly|yearly|annual|year/.test(t)){
    const s=act.slice().sort((a,b)=>monthly(b)-monthly(a))[0];
    if(s){const y=monthly(s)*12;return {reply:'Paying '+money(monthly(s))+' a month for '+s.name+' adds up to '+money(y)+' a year. If the yearly plan costs less than that and you\'ll keep it all year, yearly wins.',cards:[{service:s.name,plan:'Monthly vs yearly',price:money(y)+'/yr if monthly',kind:'discount',note:'Compare this number with the company\'s yearly plan price before switching.',domain:null}]}}
  }
  // default: look at what they pay for
  const design=act.filter(s=>['adobe-cc','canva-pro'].includes(s.slug));
  const ups=act.filter(s=>priceUp(s));
  const cards=[];
  if(design.length>=2){const keep=design.slice().sort((a,b)=>monthly(a)-monthly(b))[0],drop=design.find(s=>s!==keep);cards.push({service:drop.name,plan:'Overlaps with '+keep.name,price:money(monthly(drop))+'/mo',kind:'app',note:'Both are design tools. Dropping '+drop.name+' saves '+money(monthly(drop)*12)+' a year.',domain:null})}

  return {reply:cards.length?'Here\'s where your money is leaking right now:':'Tell me what you want to watch, use, or learn, and I\'ll find the cheapest way to get it.',cards:cards.slice(0,4)};
}

async function geminiJSONModel(turns,forceModel){

    S.chat.slice(-8).forEach(m=>{if(m.error)return;turns.push({role:m.role,content:m.role==='assistant'?JSON.stringify({reply:m.content,cards:(m.cards||[]).map(c=>({service:c.service}))}):m.content})});

/* ---------- REAL import: bank statement CSV (parsed on this device) ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true; else if(ch===','){row.push(cell);cell=''} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''} else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim()));
}
function parseDate(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2])}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parseAmt(s){s=String(s||'').replace(/[$,\s]/g,'');if(!s)return null;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}const n=parseFloat(s);if(isNaN(n))return null;return neg?-n:n}
function merchantKey(desc){
  let d=String(desc).toUpperCase().replace(/^(POS|DEBIT CARD PURCHASE|CHECKCARD|PURCHASE|RECURRING|ACH|PAYPAL \*|SQ \*|TST\*|SP \*)\s*/g,'');
  d=d.replace(/\b(DES|ID|INDN|CO ID|PPD|WEB|CCD):?.*$/,'').replace(/[#*]/g,' ').replace(/\d{3,}/g,' ').replace(/\b\d{2}\/\d{2}\b/g,' ').replace(/\s+/g,' ').trim();
  return d.split(' ').slice(0,3).join(' ');
}
function niceName(key){
  const k=key.toLowerCase();
  const known=[['spotify','Spotify Premium','spotify'],['netflix','Netflix','netflix'],['youtube','YouTube Premium','youtube-premium'],['google *youtube','YouTube Premium','youtube-premium'],['canva','Canva Pro','canva-pro'],['adobe','Adobe Creative Cloud','adobe-cc'],['amazon prime','Amazon Prime','amazon-prime'],['amzn prime','Amazon Prime','amazon-prime'],['prime video','Amazon Prime','amazon-prime'],['disney','Disney+','disney-plus'],['hulu','Hulu','hulu'],['peacock','Peacock Premium','peacock'],['audible','Audible Premium Plus','audible'],['paramount','Paramount+','paramount-plus'],['apple.com/bill','Apple subscription',null],['apple.com','Apple subscription',null],['google *','Google subscription',null],['openai','ChatGPT Plus',null],['chatgpt','ChatGPT Plus',null],['duolingo','Duolingo',null],['max.com','Max',null],['hbo','Max',null],['xbox','Xbox Game Pass',null],['playstation','PlayStation Plus',null],['planet fit','Planet Fitness',null]];
  const hit=known.find(([a])=>k.includes(a));
  if(hit) return {name:hit[1],slug:hit[2]||slugify(hit[1])};
  const n=key.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  return {name:n,slug:slugify(n)};
}
function detectRecurring(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c));
  let hi=rows.findIndex(r=>{const l=r.map(c=>c.toLowerCase());return l.some(c=>c.includes('date'))&&l.some(c=>c.includes('desc')||c.includes('payee')||c.includes('merchant')||c.includes('name'))&&l.some(c=>c.includes('amount')||c.includes('debit'))});
  if(hi<0) throw new Error('Couldn\'t find Date, Description, and Amount columns in this file.');
  const h=rows[hi].map(c=>c.toLowerCase());
  const di=h.findIndex(c=>c.includes('date')), ni=h.findIndex(c=>c.includes('desc')||c.includes('payee')||c.includes('merchant')||c==='name'), ai=h.findIndex(c=>c==='amount'||c.includes('amount')), dbi=h.findIndex(c=>c.includes('debit')), cri=h.findIndex(c=>c.includes('credit'));
  const tx=[];
  rows.slice(hi+1).forEach(r=>{const d=parseDate(r[di]);if(!d)return;let a=ai>=0?parseAmt(r[ai]):null;
    if(a===null&&dbi>=0){const db=parseAmt(r[dbi]);if(db)a=-Math.abs(db);else return}
    if(a===null||a>=0)return; const desc=r[ni]||'';if(/payment|transfer|zelle|deposit|atm|withdrawal|interest/i.test(desc))return;
    tx.push({d,amt:Math.round(-a*100),desc,key:merchantKey(desc)})});
  const groups={};tx.forEach(t=>{(groups[t.key]=groups[t.key]||[]).push(t)});
  const out=[];
  Object.values(groups).forEach(g=>{if(g.length<2)return;g.sort((a,b)=>a.d-b.d);
    const gaps=[];for(let i=1;i<g.length;i++)gaps.push(daysBetween(g[i-1].d,g[i].d));
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length; const amts=g.map(x=>x.amt); const last=amts[amts.length-1]; const mean=amts.reduce((a,b)=>a+b,0)/amts.length;
    const steady=amts.every(a=>Math.abs(a-mean)/mean<=0.2);
    let cycle=null; if(avg>=25&&avg<=35)cycle='monthly'; else if(avg>=6&&avg<=8)cycle='weekly'; else if(avg>=350&&avg<=380)cycle='yearly';
    const nn=niceName(g[0].key); const lastD=g[g.length-1].d;
    const next=cycle==='weekly'?addDays(lastD,7):cycle==='yearly'?addMonths(lastD,12):addMonths(lastD,1);
    const sure=cycle&&steady&&(g.length>=3||amts[0]===amts[1]); const up=amts.length>=2&&last>amts[amts.length-2]?last-amts[amts.length-2]:0;
    out.push({group:sure?'rec':'unsure',raw:true,name:nn.name,meta:g[0].desc.slice(0,32)+' · '+g.length+' charges'+(cycle?' · '+cycle:'')+(up?' · up '+money(up):''),price:last,on:!!sure,
      sub:{slug:nn.slug,name:nn.name,plan:'',price:last,cycle:cycle||'monthly',status:'active',nextRenewal:iso(next<today()?addMonths(today(),0):next),start:iso(g[0].d),billing:'website',foundBy:'bank',charges:g.slice(-6).map(x=>({d:iso(x.d),a:x.amt}))}});
  });
  return {count:tx.length,items:out.sort((a,b)=>(a.group==='rec'?0:1)-(b.group==='rec'?0:1)||b.price-a.price)};
}

async function geminiVision(file,prompt){

  const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file)});

    body:JSON.stringify({contents:[{role:'user',parts:[{inline_data:{mime_type:file.type||'image/png',data:b64}},{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
  if(!resp.ok){let m='HTTP '+resp.status;try{const j=await resp.json();m=(j.error&&j.error.message)||m}catch(e){}throw {code:'gemini',message:m}}

}

async function scanFile(file){

  try{

    const r=await geminiVision(file,PROMPT);
    const arr=Array.isArray(r)?r:[]; const t=today(); const have=new Set(S.subs.filter(s=>s.status!=='cancelled').map(s=>s.name.toLowerCase()));
    if(!arr.length){SHEET.p.busy=false;SHEET.p.err='No subscriptions found in that image. Try a clearer screenshot of the subscriptions list.';renderSheet();return}
    const items=arr.slice(0,20).map(x=>{const name=String(x.name||'Subscription').slice(0,60);const price=Math.max(0,parseInt(x.priceCents,10)||0);const d=/^\d{4}-\d{2}-\d{2}$/.test(x.renews||'')?x.renews:iso(addDays(t,30));const bill=x.store==='apple'?'apple':x.store==='google'?'google':'website';
      const slug=(Object.entries(EXIT).find(([k,e])=>e.name.toLowerCase().startsWith(name.toLowerCase().split(' ')[0]))||[slugify(name)])[0];
      return {group:x.trial?'trial':'rec',name,meta:(x.trial?'Trial ends ':'Renews ')+fmtDS(parse(d))+' · '+(bill==='apple'?'App Store':bill==='google'?'Google Play':'from screenshot'),price,on:true,dup:have.has(name.toLowerCase()),sub:{slug,name,plan:'',price,cycle:['monthly','yearly','weekly'].includes(x.cycle)?x.cycle:'monthly',status:x.trial?'trial':'active',trialEnd:d,nextRenewal:d,billing:bill,card:'',foundBy:'screenshot'}}});
    closeSheet(); go('review',{source:'From your screenshot.',items});
  }catch(e){SHEET.p.busy=false;SHEET.p.err=e&&e.code==='image_rejected'?'That image couldn\'t be read. Try a PNG or JPG screenshot.':e&&e.code==='not_granted'?'Allow ExitIQ to use Claude to read screenshots.':'Couldn\'t read the screenshot. Try again or add it manually.';renderSheet()}
}

/* ---------- PDF ---------- */
async function makePdf(p){
  if(!p)return; const J=window.jspdf&&window.jspdf.jsPDF; if(!J){toast('PDF tool didn\'t load. Check your connection.');return}
  if(!DOWNLOADS){toast('Downloads aren\'t available in this view');return}
  const doc=new J({unit:'pt',format:'letter'}); let y=60; const L=56; const W=500;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('Subscription dispute packet',L,y);y+=22;
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);doc.text('Prepared with ExitIQ on '+fmtD(today())+', '+today().getFullYear(),L,y);y+=30;doc.setTextColor(20);
  const row=(k,v)=>{doc.setFont('helvetica','bold');doc.text(k,L,y);doc.setFont('helvetica','normal');doc.text(String(v),L+150,y);y+=18};
  doc.setFontSize(11);
  row('Cardholder',S.user?.name||'[YOUR NAME]');row('Merchant',p.name);row('Cancelled on',fmtD(parse(p.cancelled))+', '+parse(p.cancelled).getFullYear());row('Cancellation method',p.method||'Online');row('Confirmation number',p.conf||'[CONFIRMATION NUMBER]');row('Monthly amount',money(p.price||0));row('Charge after cancelling','[DATE AND AMOUNT FROM STATEMENT]');
  y+=14;doc.setFont('helvetica','bold');doc.text('Letter to your bank',L,y);y+=18;doc.setFont('helvetica','normal');
  const letter='To my card issuer,\n\nI am disputing a charge from '+p.name+'. I cancelled this subscription on '+fmtD(parse(p.cancelled))+' ('+(p.method||'online')+'), confirmation number '+(p.conf||'[CONFIRMATION NUMBER]')+'. Despite the cancellation, I was charged again on [DATE] for [AMOUNT]. I did not authorize this charge. My proof of cancellation is attached.\n\nPlease reverse the charge.\n\nThank you,\n'+(S.user?.name||'[YOUR NAME]');
  doc.splitTextToSize(letter,W).forEach(line=>{doc.text(line,L,y);y+=15});
  if(p.notes){y+=10;doc.setFont('helvetica','bold');doc.text('Confirmation email / notes',L,y);y+=16;doc.setFont('helvetica','normal');doc.splitTextToSize(p.notes.slice(0,1500),W).slice(0,20).forEach(line=>{doc.text(line,L,y);y+=14})}
  if(p.img){try{doc.addPage();doc.setFont('helvetica','bold');doc.text('Attached: cancellation screenshot',L,60);doc.addImage(p.img,'JPEG',L,80,300,0)}catch(e){}}
  try{await DOWNLOADS.save({filename:'dispute-'+slugify(p.name)+'.pdf',data:doc.output('blob')});toast('Dispute packet saved')}catch(e){if(e&&e.code!=='declined')toast('Couldn\'t save the PDF here')}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el)return;
  if(el.dataset.a==='ovClose'&&e.target!==el)return;
  const f=A[el.dataset.a]; if(f){ if(el.tagName==='BUTTON'&&el.type!=='submit'||el.dataset.a==='ovClose') e.preventDefault(); f(el.dataset,el,e)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.step!==undefined){const k=t.dataset.step;STEPS_DONE[k]=STEPS_DONE[k]||{};STEPS_DONE[k][t.dataset.i]=t.checked}
  if(t.id==='curSel'){S.settings.currency=t.value;save();render()}
  if(t.id==='scanFile'&&t.files&&t.files[0]) scanFile(t.files[0]);
  if(t.id==='csvFile'&&t.files&&t.files[0]) csvFile(t.files[0]);
  if(t.id==='subNotes'){const s=S.subs.find(x=>x.id===t.dataset.id);if(s){s.notes=t.value;save();toast('Notes saved')}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='cLast4'){const v=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=v;const el=document.getElementById('caLast');if(el)el.textContent=v.padEnd(4,'•')}
  if(e.target.id==='cNick'){const el=document.getElementById('caNick');if(el)el.textContent=e.target.value||'My card'}
  if(e.target.id==='cq'&&SHEET){SHEET.p.q=e.target.value;SHEET.p.focus=true;renderSheet()}
});
document.addEventListener('click',e=>{const b=e.target.closest('button[type=submit]');if(b&&b.form){e.preventDefault();e.stopPropagation();handleForm(b.form)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.form&&e.target.type!=='checkbox'){e.preventDefault();handleForm(e.target.form)}});
document.addEventListener('submit',e=>{e.preventDefault();handleForm(e.target)});
async function handleForm(f){
  if(f.id==='authForm'){
    const m=VIEW.p.mode||'signup'; const email=(document.getElementById('aEmail').value||'').trim(); const name=document.getElementById('aName')?.value.trim();
    const pass=document.getElementById('aPass')?.value||'';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){VIEW.p.err='Enter a valid email address, like you@example.com.';render();return}
    if(m==='reset'){VIEW.p={mode:'login'};render();toast('If an account exists for '+email+', a reset link is on its way.');return}
    if(pass.length<8){VIEW.p.err='Your password needs at least 8 characters.';render();return}
    if(m==='signup'){if(!name){VIEW.p.err='Add your first name.';render();return} S.accounts[email.toLowerCase()]={name,pass:btoa(unescape(encodeURIComponent(pass)))}; S.user={name,email}; save(); afterAuth(true); return}
    if(!S.accounts[email.toLowerCase()]&&email.toLowerCase()==='example@gmail.com'&&pass==='password123') S.accounts[email.toLowerCase()]={name:'Monish',pass:btoa(unescape(encodeURIComponent(pass)))};
    const acc=S.accounts[email.toLowerCase()];
    if(!acc||acc.pass!==btoa(unescape(encodeURIComponent(pass)))){VIEW.p.err='That email and password don\'t match. Check them, or create an account.';render();return}
    S.user={name:acc.name,email}; save(); afterAuth(false); return;
  }
  if(f.id==='aiForm'){const i=document.getElementById('aiInput');const q=i.value;i.value='';askAI(q);return}
  if(f.id==='cardForm'){
    const k=collectCard(); Object.assign(SHEET.p,k);
    if(!/^\d{4}$/.test(k.last4)){SHEET.p.err='Enter the last 4 digits of the card.';renderSheet();return}
    const label=(k.nick||((k.issuer?k.issuer+' ':'')+SHEET.p.net))+' ••'+k.last4;
    runProgress('card',label,['Matching card ending '+k.last4+'…','Reading 90 days of charges…','Spotting repeat charges…'],()=>{
      S.connected.push({kind:'Card',name:label,synced:iso(today())});save();
      go('review',{source:'From your '+SHEET?.p?.net+' ending '+k.last4+'.',items:reviewItems('card',k.last4)})});
    return;
  }
  if(f.id==='emailForm'){
    const addr=(document.getElementById('eAddr').value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)){SHEET.p.addr=addr;SHEET.p.err='Enter a valid email address, like example@gmail.com.';renderSheet();return}
    runProgress('email',addr,['Connecting to '+addr+' (read-only)…','Reading receipts from the last 90 days…','Finding "your trial ends" emails…'],()=>{
      S.connected.push({kind:'Email',name:addr,synced:iso(today())});save();
      go('review',{source:'From '+addr+'.',items:reviewItems('email')})});
    return;
  }
  if(f.id==='bankForm'){
    const u=document.getElementById('bUser').value.trim(), p=document.getElementById('bPass').value;
    if(u!=='user_good'||p!=='pass_good'){SHEET.p.err='Those test credentials didn\'t work. Use user_good / pass_good.';renderSheet();return}
    const bank=SHEET.p.bank;
    runProgress('bank',bank,['Connecting securely…','Reading 90 days of transactions…','Spotting repeat charges…','Checking for price changes…'],()=>{
      S.connected.push({kind:'Bank',name:bank,synced:iso(today())});save();
      go('review',{demo:true,source:'From '+bank+' checking ··1234 and your email.',items:reviewItems('bank')})});
    return;
  }
  if(f.id==='manForm'){
    const name=document.getElementById('mName').value.trim(); const price=Math.round(parseFloat(String(document.getElementById('mPrice').value).replace(/[^0-9.]/g,''))*100);
    const date=document.getElementById('mDate').value; const status=SHEET.p.status==='trial'?'trial':'active';
    if(!name||!(price>=0)||!date){toast('Add a name, price, and date');return}
    const hit=Object.entries(EXIT).find(([k,e])=>e.name.toLowerCase()===name.toLowerCase());
    S.subs.push({id:uid(),slug:hit?hit[0]:slugify(name),name:hit?hit[1].name:name,plan:'',price,cycle:document.getElementById('mCycle').value,status,trialEnd:date,nextRenewal:date,start:iso(today()),billing:document.getElementById('mBill').value,card:document.getElementById('mCard').value.replace(/\D/g,'').slice(0,4),fee:false,notes:'',foundBy:'manual',remind:null,charges:[]});
    S.imported=true;save();closeSheet();go('home');toast(name+' added. Reminders are on.');return;
  }
  if(f.id==='proofForm'){
    const s=SHEET.p.id?S.subs.find(x=>x.id===SHEET.p.id):null;
    const file=document.getElementById('pImg').files[0]; const img=await readImage(file);
    const name=s?s.name:(document.getElementById('pName').value.trim()||'Subscription');
    const price=s?monthly(s):Math.round((parseFloat(document.getElementById('pPrice').value)||0)*100);
    addProof({name,slug:s?s.slug:slugify(name),price,conf:document.getElementById('pConf').value.trim(),method:document.getElementById('pMethod').value,notes:document.getElementById('pNotes').value.trim(),img,sub:s});
    closeSheet();toast('Saved to your Proof Vault');go('vault');return;
  }
}
// swipe-to-cancel
let sw=null;
document.addEventListener('touchstart',e=>{const r=e.target.closest('.srow');if(!r)return;sw={r,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,h:null};document.querySelectorAll('.srow.open').forEach(o=>{if(o!==r)o.classList.remove('open')})},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;if(sw.h===null&&(Math.abs(dx)>8||Math.abs(dy)>8))sw.h=Math.abs(dx)>Math.abs(dy);if(sw.h){sw.dx=dx;const o=sw.r.querySelector('.over');const base=sw.r.classList.contains('open')?-96:0;o.style.transition='none';o.style.transform='translateX('+Math.max(-110,Math.min(0,base+dx))+'px)'}},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const o=sw.r.querySelector('.over');o.style.transition='';o.style.transform='';if(sw.h){const open=sw.r.classList.contains('open');if(!open&&sw.dx<-50)sw.r.classList.add('open');else if(open&&sw.dx>30)sw.r.classList.remove('open')}sw=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet()});
// onboarding swipe
let obx=null;
document.addEventListener('touchstart',e=>{if(VIEW.name==='onboard')obx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(VIEW.name!=='onboard'||obx===null)return;const dx=(e.changedTouches[0].clientX)-obx;obx=null;if(dx<-60&&(VIEW.p.i||0)<3)A.obNext();else if(dx>60&&(VIEW.p.i||0)>0)A.obPrev()});

/* ---------- boot ---------- */
S=load()||fresh();
S.settings=Object.assign({remind:[7,3,1,0],theme:'system',currency:'USD'},S.settings||{});
['subs','proofs','connected','reports','dismissed','chat'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
S.subs=S.subs.filter(x=>x.slug!=='exitiq-premium');S.usage=S.usage||{};S.accounts=S.accounts||{};S.verified=S.verified||{};S.ai=S.ai||{date:'',n:0};
applyTheme(); render();
if(window.claude&&claude.use){
  claude.use('downloads').then(d=>{DOWNLOADS=d}).catch(()=>{});
}
})();
